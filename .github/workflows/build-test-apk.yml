name: Build Sell & Repair Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout POS source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: |
          npx --yes @react-native-community/cli@latest init SellRepairPOS --version 0.81.0 --skip-git-init --skip-install

      - name: Copy Sell & Repair POS
        run: |
          cp App.tsx SellRepairPOS/App.tsx
          if [ -d src ]; then
            rm -rf SellRepairPOS/src
            cp -R src SellRepairPOS/src
          fi

      - name: Install dependencies
        working-directory: SellRepairPOS
        run: npm install

      - name: Build test APK
        working-directory: SellRepairPOS/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          cp SellRepairPOS/android/app/build/outputs/apk/debug/app-debug.apk apk-output/Sell-Repair-POS-TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sell-Repair-POS-TEST-APK
          path: apk-output/Sell-Repair-POS-TEST.apk
          retention-days: 14
